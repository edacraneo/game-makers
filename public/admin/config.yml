# Dev local : Sveltia gère les dépôts locaux nativement (bouton "Work with
# a local repository" sur l'écran de connexion, navigateur Chromium requis).
# Pas besoin de proxy ni de local_backend.

backend:
  name: github
  repo: edacraneo/game-makers
  branch: main
  base_url: https://gm-cms-auth.edacraneo.workers.dev

media_folder: public/images
public_folder: /images

collections:
  - name: posts
    label: Projets
    label_singular: Projet
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: title, widget: string }
      - { label: "Slug", name: slug, widget: string }
      - { label: "Date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - label: "Tags"
        name: tags
        widget: list
        field:
          { label: Tag, name: tag, widget: select, options: [creations, collection, bartops, consoles, media-center, jeux, pcb] }
      - label: "Auteurs"
        name: authors
        widget: list
        field:
          { label: Auteur, name: author, widget: select, options: [Ian57, eLLuiGi, BudDevil, Frakasss] }
        default: [Ian57]
      - { label: "Image mise en avant", name: feature, widget: image, required: false }
      - { label: "Extrait", name: excerpt, widget: string, required: false }
      - { label: "Contenu", name: body, widget: markdown }
      - { label: "En vedette", name: featured, widget: boolean, default: false }
      - { label: "Visible", name: visible, widget: boolean, default: true }

  - name: pages
    label: Pages
    folder: src/content/pages
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: title, widget: string }
      - { label: "Slug", name: slug, widget: string }
      - { label: "Date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Contenu", name: body, widget: markdown }
